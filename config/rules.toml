# Ferro parking rules (R1-R10). See docs/PP_rules_and_pilot.md for where each came from.
# Read by the fill step (next to build). Edit here, not in code.

[r1_category_defaults]
# A store's car park is for its customers by default. Official sources override.
store = "Customers only"            # supermarket, shop, retail park, fast food, gym
hotel = "Guests only"
hospital = "Patients and visitors"

[r3_own_brand_operators]
# OSM operator tag equal to the store itself = landowner, not the parking company.
# Also the brand list tranche1_write.py uses to attach a store-named car park
# to its existing sheet row instead of adding it as a new place (one list,
# not two): a DIY/furniture retailer's own car park is the same case as a
# supermarket's.
names = ["morrisons", "asda", "m&s", "marks & spencer", "mcdonald's", "currys",
         "currys pc world", "lidl", "aldi", "tesco", "sainsbury's", "waitrose",
         "iceland", "co-op", "b&q", "ikea"]

[r4]
# OSM max stay never goes into Max Stay on its own: Notes only, until confirmed.
osm_max_stay_to_notes = true

[r6]
# Chain rules come from finished rows with a strong, Site-specific source only.
min_rows = 8
min_agreement = 0.80
max_stay_is_chain_rule = false      # max stay varies by store (PureGym 90-240 mins)

# Chain rules found on 2026-11-02 (chain_rules_candidates_v2.csv). "hint" is
# R10's chain hint: Notes only, never a structured value (rule R7).
[r6.chains.tesco]
who_can_park = "Customers only"
hint = "Max stay set per store by usage and capacity; some London stores charge non-customers"
[r6.chains.sainsburys]
who_can_park = "Customers only"
hint = "Free to paid depending on store"
[r6.chains.lidl]
hint = "Usually 90 minutes free for customers where a parking system is installed"
[r6.chains.aldi]
hint = "Limited parking time, usually 90 minutes"
[r6.chains.asda]
who_can_park = "Customers only"
cost_type = "Free"
[r6.chains."the gym group"]
who_can_park = "Customers only"
cost_type = "Free"
[r6.chains.puregym]
cost_type = "Free"
[r6.chains."premier inn"]
who_can_park = "Guests only"
[r6.chains.travelodge]
who_can_park = "Guests only"
[r6.chains.morrisons]
operator = "Euro Car Parks"
[r6.chains."euro car parks"]
who_can_park = "Anyone (paid)"
cost_type = "Paid"
operator = "Euro Car Parks"
[r6.chains.ncp]
who_can_park = "Anyone (paid)"
cost_type = "Paid"
operator = "NCP"
[r6.chains."harrow council"]
who_can_park = "Anyone (paid)"
cost_type = "Free then paid"
operator = "Harrow Council"

[r6.council_car_parks]
# Bromley, Bexley, Croydon, Merton, Ealing, Brent, Greenwich, Kingston, City of London, Barnet, Enfield
who_can_park = "Anyone (paid)"
cost_type = "Paid"
operator = "the council itself"

[r6.station_car_parks]
# National Rail, Southeastern, Southern, TfL. Operator APCOA is likely, not certain (80-92%).
who_can_park = "Anyone (paid)"
cost_type = "Paid"

[r7]
# A wrong cautious value (Customers only, Guests only, Paid, Unknown) costs little.
# A wrong Free or Anyone value costs the driver money or a fine, so it needs
# stronger, site-specific evidence. An OSM tag alone (fill.py) and a chain
# rule or category default alone (policy_fill.py, the category policy)
# never set Cost Type = Free or Who Can Park = Anyone / Anyone (paid); OSM
# fee=no becomes a Notes line, never a value (2026-11-04: this used to be
# allowed on a customers-only car park, access=customers/destination; no
# longer, after a direct instruction that fee=no must never become Free).
risky_cost_types = ["Free"]
risky_who_can_park = ["Anyone", "Anyone (paid)"]
cautious_cost_types = ["Paid", "Free then paid", "Unknown"]
cautious_who_can_park = ["Customers only", "Guests only", "Unknown"]

[r8]
# Text PP captured from an official page, sitting in the "(as captured)"
# columns, Charges (as published), Enforcement Details or Notes, counts as
# evidence from that page (captured 30-31 Oct 2026; R2: parking rules
# rarely change). Only text about this exact site is site-specific; a
# chain-wide policy line is Chain-wide / Chain policy, and under R7 never
# sets Free or a max stay. Text that is only a status word is not evidence.
captured_date = "2026-10-30 to 2026-10-31"
status_words = ["UNCLEAR", "NOT PUBLISHED", "NOT STATED", "VERIFY", "TBC"]
tfl_is_operator_source = true  # TfL's own data counts as Source Tier "Operator / council site"

[r9]
# Can Park? = No needs an explicit negative statement on the official page,
# not mere silence or capture shorthand (e.g. "N/A on site", "no parking
# facility listed"). Silence is not evidence of No: leave the row for Grok.
explicit_no_parking_phrases = [
    "no car park", "no customer parking", "no parking available",
    "parking not available", "no parking facilities", "no on-site parking",
    "no parking on site", "does not have a car park", "does not have parking",
    "no parking spaces", "no accessible parking spaces", "no public car park",
    "no public parking", "there is no car park", "no hotel parking",
    "no on-site hotel parking", "no off-street hospital parking",
    "no on-site car park",
]

[r10]
# Every row gets an Evidence Level: "Verified" (evidence about this exact
# site), "Chain policy" (the chain's published rule applied to a branch), or
# "Presumed" (category plus map, no page or sign read at all). Chain policy
# and Presumed rows may only set cautious values (Who Can Park Customers
# only / Guests only, Cost Type Unknown or Paid, Max Stay Not published),
# same spirit as rule R7: a category or chain guess never becomes Free, a
# max stay, or Who Can Park Anyone.
nearby_car_park_radius_m = 40

# Large formats count as having a car park on the chain's own authority.
# Convenience formats only count with an OSM car park within
# nearby_car_park_radius_m of the branch: a small-format store on a high
# street often has none. Each entry is a list of words that must all
# appear in the location name (in any order, not necessarily adjacent),
# matched against the normalised name so "Tesco Acton Superstore" matches
# ["tesco", "superstore"].
large_formats = [
    ["tesco", "superstore"], ["tesco", "extra"], ["sainsburys", "superstore"],
    ["lidl"], ["aldi"], ["asda"], ["morrisons"],
]
convenience_formats = [
    ["tesco", "express"], ["tesco", "metro"], ["sainsburys", "local"],
    # Plain "Waitrose" and "Waitrose & Partners" count here too, not just
    # "Little Waitrose": Waitrose runs no large-format branch of its own.
    ["waitrose"], ["simply", "food"], ["co", "op"],
]

# A Presumed Can Park? = No is allowed only for these small venue types, and
# only with no OSM car park within nearby_car_park_radius_m.
small_venue_categories = ["cafe", "pub", "restaurant", "convenience shop",
                           "fast food"]
# A drive-thru fast food branch is excluded: it has its own parking.
fast_food_drive_thru_excluded = true

# DRAFT category policies (2026-11-04), proposed for discovery's hospital and
# petrol_station categories. NOT wired into fill.py, policy_fill.py or the
# Rules dataclass: only fill_round2.py's category-policy step reads this
# section, so switching it on anywhere else is a separate, deliberate choice.
#
# Two corrections from how this was first asked for, both against the sheet's
# real dropdown values (checked in the live export): "Price Status = Paid" for
# hospital names a Cost Type value, not a Price Status one (Price Status's own
# values are Not published / Published / Chain policy (not store-specific) /
# Not applicable), so this reads as Cost Type = Paid, Price Status = Chain
# policy (not store-specific), the pairing every existing Evidence Level =
# Chain policy row already uses. "Who Can Park = Customers" for petrol
# station is read as the sheet's real value, "Customers only". Rule R7 still
# applies: a category policy never sets Free, Anyone, or a max stay, so
# max_stay_mins is always "Not published".
[category_policies.hospital]
who_can_park = "Patients and visitors"
cost_type = "Paid"
price_status = "Chain policy (not store-specific)"
max_stay_mins = "Not published"
rules_summary = "Hospital parking, usually paid, check signs on arrival"
evidence_level = "Chain policy"

[category_policies.petrol_station]
who_can_park = "Customers only"
cost_type = "Unknown"
price_status = "Chain policy (not store-specific)"
max_stay_mins = "Not published"
rules_summary = "Customer parking while fuelling or shopping, check signs"
evidence_level = "Chain policy"

# Brand is identity, not permission. A chain branch carries a brand, and a
# private, operator, council or station car park carries an Operator instead.
# A Yes or Conditional row always needs Place Category; it needs Brand only
# for these categories. Measured on 12 November 2026: 3,526 of the 4,095
# queued places with no Brand are private or operator car parks.
[identity]
brand_required_categories = [
    "Supermarket - large format", "Supermarket - convenience", "Hotel",
    "Gym / leisure centre", "Fast food / drive-thru", "Restaurant / pub / cafe",
    "Retail warehouse / DIY / trade", "Petrol station",
]

# Exact sheet dropdown values used by the standalone validator.
[dropdowns]
"Can Park? (Yes/No/Conditional)" = ["Conditional", "No", "Unknown", "Yes"]
"Who Can Park" = ["Anyone", "Anyone (paid)", "Customers only", "Guests only", "Not applicable", "Patients and visitors", "Permit holders", "Unknown"]
